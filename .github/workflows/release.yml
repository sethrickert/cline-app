name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm check

      - name: Compile Cline service
        run: pnpm build:sidecar

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: Cline Chat v__VERSION__
          releaseBody: |
            Cline Chat 1.2.1 publishes the final Windows interface and attachment fixes that were merged after the original 1.2.0 release.

            Highlights:
            - Additive Favorites, Recommended, All Models, and Free Models sections
            - Consistent FREE badges and account-aware model details
            - Reliable PDF text extraction and vision-model image handling
            - Circular profile pictures with local upload, HTTPS URL, and crop controls
            - Ctrl+S search, visible pin controls, and per-answer sharing
            - Pacific default branding and a dedicated gear-overlay EXE installer icon
            - Validated custom accent editing without repeated errors

            Download the EXE for the normal Windows installer or the MSI for managed deployment. Existing installations can update from Settings after this release is published.
          releaseDraft: false
          prerelease: false
