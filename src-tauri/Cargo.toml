[package]
name = "cline-chat"
version = "1.2.1"
description = "Windows desktop chat for Cline models"
authors = ["Cline Chat contributors"]
license = "MIT"
repository = "https://github.com/sethrickert/cline-app"
edition = "2021"

[[bin]]
name = "cline-chat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
